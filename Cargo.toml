[workspace]
members = [
  "contracts/escrow",
  "contracts/test-stubs/mock-outlayer",
  "workers/email-verifier",
  "workers/cryptorefills-verifier",
  "workers/token-verifier",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

# Size-optimised profile for on-chain contracts (escrow: `cargo near build ... --profile contract`).
[profile.contract]
inherits = "release"
opt-level = "z"
overflow-checks = true
debug = false
strip = true
