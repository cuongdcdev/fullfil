[package]
name = "fulfil-escrow"
version = "0.1.0"
edition = "2021"
description = "Fulfil escrow: order funds held as NEP-245 balances inside intents.near, payout gated by an OutLayer verifier"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
# sandbox integration test (tests/sandbox.rs)
near-workspaces = { version = "0.22.1", default-features = false, features = ["install"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
rand = "0.8"
anyhow = "1"
hex = "0.4"
